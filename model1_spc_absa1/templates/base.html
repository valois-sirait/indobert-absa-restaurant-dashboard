<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentiment Analysis Dashboard{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid">
            
            <a class="navbar-brand" href="{{ url_for('main.index') }}"><i class="fas fa-chart-pie"></i> SPC-ABSA</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="mobile-menu-icon"><i class="fas fa-bars"></i></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'main.management_data' %}active{% endif %}" href="{{ url_for('main.management_data') }}">Management Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard.dashboard_page' %}active{% endif %}" href="{{ url_for('dashboard.dashboard_page') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'report.index' or request.endpoint == 'report.detail' %}active{% endif %}" href="{{ url_for('report.index') }}">Laporan Detail</a>
                    </li>
                    <li class="nav-item ms-lg-3 border-start ps-lg-3 d-flex align-items-center">
                        <a id="logoutBtn" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-2 py-2" href="{{ url_for('auth.logout') }}" title="Keluar">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Navigation routes: /dashboard_analisis, /manajemen_data, /laporan_detail -->
    <div class="container-main">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Add active class to current page link
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>

    <!-- SweetAlert2 Library -->
    <link rel="stylesheet" href="{{ url_for('static', filename='sweetalert2.min.css') }}">
    <script src="{{ url_for('static', filename='js/sweetalert2.all.min.js') }}"></script>


    <!-- File Notifikasi Sentral Anda -->
    <script src="{{ url_for('static', filename='js/app-notifications.js') }}"></script>

</body>
</html>
